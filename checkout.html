<!-- checkout.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .checkout-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 500px;
        }

        h2 {
            text-align: center;
        }

        .checkout-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .checkout-total {
            font-weight: bold;
            margin-top: 20px;
            text-align: right;
        }

        input[type="text"] {
            padding: 10px;
            width: 100%;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        button {
            padding: 10px 20px;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .payment-methods {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .payment-methods input {
            margin-right: 10px;
        }

        .cancel-button {
            background-color: #dc3545;
            margin-top: 10px;
            width: 48%;
        }

        .cancel-button:hover {
            background-color: #c82333;
        }

        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            width: 300px;
        }

        .popup-content button {
            margin-top: 20px;
            background-color: #28a745;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h2>Checkout</h2>
        <div id="checkoutItemsList"></div>

        <p class="checkout-total">Total: $<span id="checkoutTotalBefore">0</span></p>
        <p class="checkout-total">Discount: -$<span id="checkoutDiscount">0</span></p>
        <p class="checkout-total">Total After Discount: $<span id="checkoutTotalAfter">0</span></p>

        <input type="text" id="checkoutDiscountCode" placeholder="Enter discount code">
        <button onclick="applyCheckoutDiscount()">Apply Discount</button>

        <div class="payment-methods">
            <label><input type="radio" name="paymentMethod" value="MasterCard" checked> MasterCard</label>
            <label><input type="radio" name="paymentMethod" value="VisaCard"> Visa Card</label>
        </div>

        <div>
            <button onclick="proceedToPayment()">Proceed to Payment</button>
            <button class="cancel-button" onclick="cancelCheckout()">Cancel</button>
        </div>
    </div>

    <!-- Popup for thank you message -->
    <div id="thankYouPopup" class="popup">
        <div class="popup-content">
            <h3>Thank you for your purchase!</h3>
            <p>Your payment has been processed successfully.</p>
            <button onclick="closePopup()">Close</button>
        </div>
    </div>

    <script>
        // Retrieve cart items from localStorage
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // Update checkout page with cart items
        function updateCheckout() {
            const checkoutItemsList = document.getElementById('checkoutItemsList');
            const checkoutTotalBefore = document.getElementById('checkoutTotalBefore');
            const checkoutTotalAfter = document.getElementById('checkoutTotalAfter');
            const checkoutDiscount = document.getElementById('checkoutDiscount');
            
            // Clear the current list
            checkoutItemsList.innerHTML = '';

            // Add each item to the checkout list
            let totalBeforeDiscount = 0;
            cart.forEach(item => {
                const li = document.createElement('div');
                li.className = 'checkout-item';
                const itemTotal = (item.price * item.quantity).toFixed(2);
                li.innerHTML = `${item.itemName} - $${item.price.toFixed(2)} x ${item.quantity} = $${itemTotal}`;
                checkoutItemsList.appendChild(li);
                totalBeforeDiscount += item.price * item.quantity;
            });

            // Update the total price before discount
            checkoutTotalBefore.textContent = totalBeforeDiscount.toFixed(2);
            checkoutTotalAfter.textContent = totalBeforeDiscount.toFixed(2);
        }

        // Apply discount on checkout page
        function applyCheckoutDiscount() {
            const discountCode = document.getElementById('checkoutDiscountCode').value;
            let discount = 0;

            // Simple discount logic (50% off for 'KICK25' code)
            if (discountCode === 'KICK25') {
                discount = 0.5;  // 50% discount
                alert('Discount applied! You get 50% off.');
            } else {
                alert('Invalid discount code.');
            }

            // Update the discount and total after discount
            const totalBeforeDiscount = parseFloat(document.getElementById('checkoutTotalBefore').textContent);
            const discountedTotal = totalBeforeDiscount - (totalBeforeDiscount * discount);
            
            document.getElementById('checkoutDiscount').textContent = (totalBeforeDiscount * discount).toFixed(2);
            document.getElementById('checkoutTotalAfter').textContent = discountedTotal.toFixed(2);
        }

        // Proceed to payment
        function proceedToPayment() {
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            alert(`You have selected ${paymentMethod} for payment.`);

            // Show the thank you popup after payment
            showThankYouPopup();
        }

        // Show thank you popup
        function showThankYouPopup() {
            document.getElementById('thankYouPopup').style.display = 'flex';
        }

        // Close thank you popup
        function closePopup() {
            document.getElementById('thankYouPopup').style.display = 'none';
            // Optionally, you can redirect the user to the home page or cart page
            window.location.href = 'index.html'; // Redirect to the cart page after thanking
        }

        // Cancel checkout and go back to the cart page
        function cancelCheckout() {
            const confirmCancel = confirm('Are you sure you want to cancel? You will lose your progress.');
            if (confirmCancel) {
                window.location.href = 'cart.html'; // Redirect to cart page or home page
            }
        }

        // Call function to display checkout items
        updateCheckout();
    </script>

</body>
</html>
