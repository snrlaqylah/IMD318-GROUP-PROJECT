<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport Shoes E-commerce</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 40px;
            background-color: #f4f4f4;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        header .logo {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        header .actions {
            position: absolute;
            right: 20px;
            display: flex;
            gap: 5px;
        }
        
        header .actions img {
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        header .actions img:hover {
            transform: scale(1.2);
        }

nav {
  background-color: #333;
  padding: 10px 0;
  text-align: center;
  position: relative; /* Necessary for dropdown positioning */
}

nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex; /* Ensures menu items are in one line */
  justify-content: center;
  align-items: center;
}

nav ul li {
  position: relative; /* For dropdown positioning */
  margin: 0 15px;
}

nav a {
  color: white;
  text-decoration: none;
  font-size: 18px;
  padding: 10px 15px; /* Adds padding for clickable area */
  transition: color 0.3s, background-color 0.3s;
}

nav a:hover {
  text-decoration: underline;
  color: #e74c3c;
}

nav ul li .dropdown {
  display: none;
  position: absolute;
  top: 100%; /* Position below the parent menu */
  left: 0;
  background-color: #444; /* Matches overall design */
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  list-style: none;
  padding: 5px 0; /* Adds spacing inside dropdown */
  margin: 0;
  z-index: 1000;
  border-radius: 5px; /* Smooth edges */
}

nav ul li .dropdown li {
  width: 180px; /* Adjust for consistent dropdown size */
}

nav ul li .dropdown li a {
  text-decoration: none;
  display: block;
  padding: 10px;
  color: white;
  background-color: #444; /* Matches dropdown background */
  transition: background-color 0.3s, color 0.3s;
}

nav ul li:hover .dropdown {
  display: block; /* Show dropdown on hover */
}

nav ul li .dropdown li a:hover {
  background-color: #555; /* Slightly lighter for hover effect */
  color: #e74c3c;
}


        .cart-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .cart-popup {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow-x: auto;
        }

        .cart-popup h3 {
            margin-top: 0;
        }

        .cart-popup button {
            margin-top: 10px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-popup button:hover {
            background-color: #0056b3;
        }

        .cart-popup table {
            width: 100%;
            border-collapse: collapse;
        }

        .cart-popup table, th, td {
            border: 1px solid #ddd;
        }

        .cart-popup th, td {
            padding: 12px;
            text-align: left;
        }

        .cart-popup th {
            background-color: #f4f4f4;
        }

        .cart-popup td {
            vertical-align: middle;
        }

        .cart-popup select {
            padding: 5px;
            width: 100px;
        }

        .cart-popup button.remove-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            border-radius: 5px;
        }

        .cart-popup button.remove-btn:hover {
            background-color: darkred;
        }

        /* Style for the cart count */
        .cart-count {
            position: absolute;
            top:-15px; /* Adjust top for positioning */
            right: 30px; /* Adjust right for positioning */
            background-color: red;
            color: white;
            border-radius: 50%;
            padding: 5px;
            font-size: 14px;
            width: 10px;
            height: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="image/logo2.svg" alt="SportShoes Logo" style="width: 100px; height: auto;">
    </div>
    <div class="actions">
        <!-- Cart Button with Item Count -->
        <a href="cart.html">
            <img src="image/5.svg" alt="Cart" id="cartButton">
            <span id="cartCount" class="cart-count">0</span>
        </a>
    </div>
</header>

<div class="cart-container">
    <div class="cart-popup">
        <h3>Your Cart</h3>
        <table id="cartItemsList">
            <!-- Cart items will be displayed here -->
        </table>
        <button onclick="checkout()">Checkout</button>
        <button onclick="clearCart()">Clear Cart</button>
        <button onclick="closeCart()">Close</button>
    </div>
</div>

<script>

  // Function to add item to cart
  function addItemToCart(itemId, quantity = 1, size = 'Medium') {
    const item = items.find(i => i.id === itemId);
    if (item) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existingItemIndex = cart.findIndex(cartItem => cartItem.id === itemId && cartItem.size === size);
      
      if (existingItemIndex > -1) {
        // Update the quantity if the item already exists in the cart
        cart[existingItemIndex].quantity += quantity;
      } else {
        // Add new item to cart
        cart.push({
          id: item.id,
          itemName: item.name,
          price: item.price,
          quantity,
          size
        });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      displayCartItems(); // Refresh cart display
    }
  }

  // Function to display cart items
  function displayCartItems() {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const cartContainer = document.getElementById('cartItemsList');
    cartContainer.innerHTML = '';

    if (cart.length === 0) {
      cartContainer.innerHTML = '<p>Your cart is empty.</p>';
    } else {
      let totalPrice = 0;
      let tableContent = `
        <thead>
          <tr>
            <th>Item</th>
            <th>Size</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Remove</th>
          </tr>
        </thead>
        <tbody>
      `;

      cart.forEach((item, index) => {
        tableContent += `
          <tr>
            <td>${item.itemName}</td>
            <td>
              <select onchange="updateSize(${index}, this.value)">
                <option value="Small" ${item.size === "Small" ? "selected" : ""}>Small</option>
                <option value="Medium" ${item.size === "Medium" ? "selected" : ""}>Medium</option>
                <option value="Large" ${item.size === "Large" ? "selected" : ""}>Large</option>
              </select>
            </td>
            <td>$${item.price}</td>
            <td><input type="number" value="${item.quantity}" min="1" onchange="updateQuantity(${index}, this.value)" /></td>
            <td>$${(item.price * item.quantity).toFixed(2)}</td>
            <td><button class="remove-btn" onclick="removeItemFromCart(${index})">Remove</button></td>
          </tr>
        `;
        totalPrice += item.price * item.quantity;
      });

      tableContent += `
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4">Total</td>
            <td>$${totalPrice.toFixed(2)}</td>
            <td></td>
          </tr>
        </tfoot>
      `;

      cartContainer.innerHTML = tableContent;
      document.getElementById('cartCount').innerText = cart.length;
    }
  }

  // Update cart item size
  function updateSize(index, newSize) {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart[index].size = newSize;
    localStorage.setItem('cart', JSON.stringify(cart));
    displayCartItems();
  }

  // Update cart item quantity
  function updateQuantity(index, newQuantity) {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    if (newQuantity > 0) {
      cart[index].quantity = newQuantity;
    }
    localStorage.setItem('cart', JSON.stringify(cart));
    displayCartItems();
  }

  // Remove item from cart
  function removeItemFromCart(index) {
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    displayCartItems();
  }

  // Clear cart
  function clearCart() {
    localStorage.removeItem('cart');
    displayCartItems();
  }

function checkout() {
    window.location.href = "checkout.html"; // Replace 'checkout.html' with the actual path to your checkout page
}


  // Close the cart popup
  function closeCart() {
    window.location.href = 'index.html'; // Redirect to home page or previous page
  }

  // Load cart items on page load
  window.onload = displayCartItems;
</script>


</body>
</html>
